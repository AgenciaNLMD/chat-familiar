<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="chat-page">
    <header class="chat-header">
      <img class="avatar-img" id="header-avatar" alt="" />
      <div class="title">
        <h2>Chat familiar</h2>
        <div class="who">vos: <strong id="me">…</strong></div>
      </div>
      <button class="help-btn" id="ayuda" title="Información" aria-label="Información y teléfonos">?</button>
    </header>

    <div class="info-overlay hidden" id="infoOverlay">
      <div class="info-card">
        <div class="info-topbar">
          <button class="info-back hidden" id="infoBack">← Volver</button>
          <button class="info-close" id="infoClose" aria-label="Salir">×</button>
        </div>
        <div id="infoBody"></div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <form class="composer" id="composer">
      <button type="button" class="attach-btn" id="attach" title="Adjuntar (próximamente)">+</button>
      <div class="input-pill">
        <input id="input" type="text" placeholder="Escribí un mensaje" autocomplete="off" maxlength="1000" />
        <span id="rec-indicator" class="rec-indicator hidden">
          <span class="rec-dot"></span> Grabando <span id="rec-time">0:00</span>
        </span>
      </div>
      <button type="button" class="round-btn" id="action" title="Grabar o enviar"></button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const ICON_MIC =
      '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>';
    const ICON_STOP =
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    const ICON_SEND =
      '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
    const MAX_SEG = 30; // segundos máximos de grabación

    let me = null;
    let socket = null;
    let perfiles = {}; // user -> { nombre, avatar }
    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("input");
    const actionBtn = document.getElementById("action");
    const recInd = document.getElementById("rec-indicator");
    const recTime = document.getElementById("rec-time");

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
    function hora(ts) {
      return new Date(ts).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    }
    function scrollDown() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function cuerpo(m) {
      if (m.type === "audio") {
        return `<audio controls preload="metadata" src="${m.url}"></audio>`;
      }
      return `<div>${esc(m.text)}</div>`;
    }
    function addMessage(m) {
      const mine = m.user === me;
      const p = perfiles[m.user] || {};
      const nombre = p.nombre || m.user;

      const row = document.createElement("div");
      row.className = "msg-row " + (mine ? "mine" : "other");

      if (!mine && p.avatar) {
        const av = document.createElement("img");
        av.className = "bubble-avatar";
        av.src = p.avatar;
        av.alt = nombre;
        row.appendChild(av);
      }

      const div = document.createElement("div");
      div.className = "bubble " + (mine ? "mine" : "other");
      div.innerHTML =
        (mine ? "" : `<div class="name">${esc(nombre)}</div>`) +
        cuerpo(m) +
        `<div class="time">${hora(m.ts)}</div>`;
      row.appendChild(div);
      messagesEl.appendChild(row);
    }
    function addSystem(text) {
      const div = document.createElement("div");
      div.className = "system-line";
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollDown();
    }

    // ---- Botón: micrófono cuando está vacío, enviar cuando hay texto ----
    let mediaRecorder = null;
    let chunks = [];
    let audioSupported = false;
    let recTimer = null;
    let recStart = 0;

    function startRecUI() {
      recStart = Date.now();
      input.classList.add("hidden");
      recInd.classList.remove("hidden");
      recTime.textContent = "0:00";
      recTimer = setInterval(() => {
        const s = Math.floor((Date.now() - recStart) / 1000);
        recTime.textContent = `0:${String(s).padStart(2, "0")}`;
        if (s >= MAX_SEG && mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
        }
      }, 250);
    }
    function stopRecUI() {
      clearInterval(recTimer);
      recTimer = null;
      input.classList.remove("hidden");
      recInd.classList.add("hidden");
    }

    function pickMime() {
      const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      for (const c of cands) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
      }
      return "";
    }
    function refreshAction() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        actionBtn.innerHTML = ICON_STOP;
        actionBtn.classList.add("recording");
        return;
      }
      actionBtn.classList.remove("recording");
      actionBtn.innerHTML = input.value.trim().length > 0 ? ICON_SEND : ICON_MIC;
    }
    function sendText() {
      const text = input.value.trim();
      if (!text) return;
      socket.emit("message", text);
      input.value = "";
      refreshAction();
      input.focus();
    }
    async function startRec() {
      if (!audioSupported) {
        alert("El micrófono necesita https (usá el túnel de VS Code) o abrir el chat en la PC.");
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        alert("No se pudo acceder al micrófono. Revisá los permisos del navegador.");
        return;
      }
      const mime = pickMime();
      mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      chunks = [];
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        stopRecUI();
        refreshAction();
        const blob = new Blob(chunks, { type: mime || "audio/webm" });
        if (!blob.size) return;
        const buf = await blob.arrayBuffer();
        socket.emit("audio", { mime: blob.type, data: buf });
      };
      mediaRecorder.start();
      startRecUI();
      refreshAction();
    }

    actionBtn.onclick = () => {
      if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
      if (input.value.trim()) { sendText(); return; }
      startRec();
    };
    input.addEventListener("input", refreshAction);
    document.getElementById("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      sendText();
    });

    // Un solo audio reproduciéndose a la vez: al dar play a uno, se pausan los demás.
    messagesEl.addEventListener(
      "play",
      (e) => {
        messagesEl.querySelectorAll("audio").forEach((a) => {
          if (a !== e.target) a.pause();
        });
      },
      true
    );

    async function init() {
      const res = await fetch("/api/me");
      const data = await res.json();
      if (!data.user) { window.location.href = "/login.html"; return; }
      me = data.user;
      document.getElementById("me").textContent = data.nombre || me;
      if (data.avatar) document.getElementById("header-avatar").src = data.avatar;

      // Mapa de avatares para las burbujas
      try {
        const lista = await (await fetch("/api/perfiles")).json();
        lista.forEach((p) => { perfiles[p.user] = { nombre: p.nombre, avatar: p.avatar }; });
      } catch {}

      audioSupported = !!(
        navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder
      );
      refreshAction();

      socket = io();
      socket.on("history", (msgs) => {
        messagesEl.innerHTML = "";
        msgs.forEach(addMessage);
        scrollDown();
      });
      socket.on("message", (m) => { addMessage(m); scrollDown(); });
      socket.on("system", addSystem);
    }

    // ---- Panel de información: teléfonos + guía de maltrato ----
    const CATEGORIAS = {
      fisico: {
        titulo: "1. Maltrato físico",
        desc: "Acciones que causan dolor o lesiones físicas.",
        ejemplos: [
          "Tirones de pelo.",
          "Empujones.",
          "Golpes, cachetadas o sacudidas.",
          "Cualquier castigo físico.",
        ],
      },
      psicologico: {
        titulo: "2. Maltrato psicológico o emocional",
        desc: "Conductas repetidas que afectan la autoestima, la seguridad o el bienestar emocional del niño.",
        ejemplos: [
          "Gritarle de forma habitual.",
          "Amenazar con que no volverá a ver a su papá.",
          "Quitarle el celular para impedir que se comunique con su papá.",
          "Bloquear o desinstalar WhatsApp u otras apps para que no pueda comunicarse con su papá o familiares.",
          "Revisar, borrar o controlar sus mensajes para impedir el contacto con su familia.",
          "Humillarlo, insultarlo o descalificarlo.",
          "Manipularlo para que rechace al otro progenitor.",
          "Hacerlo sentir culpable por querer a su padre.",
        ],
      },
      negligencia: {
        titulo: "3. Negligencia o abandono",
        desc: "Falta de atención a las necesidades básicas del niño.",
        ejemplos: [
          "No brindarle alimentación, higiene o atención médica.",
          "No garantizar que asista a la escuela.",
          "Dejarlo solo cuando no tiene edad o condiciones para cuidarse.",
          "Desentenderse completamente de su educación o necesidades emocionales.",
        ],
        nota:
          "Trabajar y volver tarde: por sí solo no es abandono. No ayudar en las tareas escolares: por sí solo no es abandono; podría ser un indicador de negligencia solo si forma parte de un patrón de desatención importante.",
      },
      exposicion: {
        titulo: "4. Exposición a violencia familiar",
        desc: "Cuando el niño presencia o queda involucrado en conflictos violentos entre adultos.",
        ejemplos: [
          "Presenciar peleas, gritos o agresiones entre sus padres.",
          "Ser utilizado como mensajero en conflictos.",
          "Escuchar amenazas constantes entre los adultos.",
          "Quedar en medio de disputas por la tenencia o el régimen de comunicación.",
        ],
      },
    };
    const INDICE = [
      { txt: "Tirones de pelo", cat: "fisico", ok: true, veredicto: "✔️ Es Maltrato físico." },
      { txt: "Gritos frecuentes", cat: "psicologico", ok: true, veredicto: "✔️ Es Maltrato psicológico o emocional." },
      { txt: "Amenazar con que no verá más a su papá", cat: "psicologico", ok: true, veredicto: "✔️ Es Maltrato psicológico o emocional." },
      { txt: "Quitarle el celular para impedir el contacto con su papá", cat: "psicologico", ok: true, veredicto: "✔️ Maltrato psicológico o emocional (si el objetivo es impedir el vínculo)." },
      { txt: "Bloquear WhatsApp para que no hable con su papá o familiares", cat: "psicologico", ok: true, veredicto: "✔️ Es Maltrato psicológico o emocional. Impedir la comunicación con un progenitor o familiares afecta el vínculo y el bienestar del niño." },
      { txt: "Trabajar muchas horas", cat: "negligencia", ok: false, veredicto: "❌ No constituye abandono por sí mismo." },
      { txt: "No ayudar con las tareas escolares", cat: "negligencia", ok: false, veredicto: "❌ No constituye abandono por sí mismo, salvo que forme parte de una desatención mucho más amplia y persistente." },
    ];

    const DISCIPLINA_VS = {
      disciplina: [
        "Busca enseñar, guiar y ayudar al niño a entender los límites.",
        "Respeta su dignidad: nunca lo humilla, insulta ni lo lastima.",
        "Es proporcional y explicada: el niño entiende por qué.",
        "Se hace con calma y autocontrol, no desde la ira.",
        "Ejemplos: hablar y explicar, acordar consecuencias razonables (por ejemplo menos tiempo de pantalla), reforzar lo positivo.",
      ],
      violencia: [
        "Busca imponer, castigar o desahogar el enojo del adulto.",
        "Daña física o emocionalmente: golpes, gritos, humillaciones, amenazas.",
        "Es desproporcionada, impredecible o cruel.",
        "Se hace desde la ira y la pérdida de control.",
        "Ejemplos: cachetadas o golpes, gritos habituales, amenazar con no verlo más, bloquearle el contacto con su papá o familiares.",
      ],
      clave:
        "La disciplina educa y cuida; la violencia lastima y controla. Ningún castigo físico ni humillación es disciplina: siempre es violencia.",
    };

    const infoOverlay = document.getElementById("infoOverlay");
    const infoBody = document.getElementById("infoBody");
    const infoBack = document.getElementById("infoBack");
    const infoClose = document.getElementById("infoClose");
    let vistaStack = [];

    function htmlMenu() {
      return `
        <h3>ℹ️ Información</h3>
        <h4>📞 Teléfonos importantes</h4>
        <ul class="contactos">
          <li>
            <div class="contacto-nombre">Papá</div>
            <a class="contacto-tel" href="tel:1130720676">11 3072 0676</a>
            <div class="contacto-dir">General Rivas 527</div>
          </li>
          <li>
            <div class="contacto-nombre">Abuela</div>
            <a class="contacto-tel" href="tel:1136673968">11 3667 3968</a>
            <div class="contacto-dir">General Urquiza 1548 · Boedo</div>
          </li>
          <li>
            <div class="contacto-nombre">Infancia y Niñez</div>
            <a class="contacto-tel" href="tel:52800411">5280 0411</a>
          </li>
        </ul>
        <button class="info-item-btn" data-goto="indice">
          🛡️ Tipos de maltrato y violencia <span class="chev">›</span>
        </button>
        <button class="info-item-btn" data-goto="disciplina">
          ⚖️ Diferencia entre disciplina y violencia <span class="chev">›</span>
        </button>
        <button class="info-logout" data-action="logout">Cerrar sesión</button>
      `;
    }
    function htmlIndice() {
      const items = INDICE.map((it, i) => `
        <button class="indice-item ${it.ok ? "ok" : "no"}" data-goto="detalle" data-idx="${i}">
          <span class="indice-mark">${it.ok ? "✔️" : "❌"}</span>
          <span class="indice-txt">${it.txt}</span>
          <span class="chev">›</span>
        </button>`).join("");
      return `
        <h3>🛡️ Tipos de maltrato</h3>
        <p class="info-lead">Tocá un ejemplo para ver a qué tipo de maltrato corresponde.</p>
        <div class="indice-lista">${items}</div>
      `;
    }
    function htmlDetalle(idx) {
      const it = INDICE[idx];
      const cat = CATEGORIAS[it.cat];
      const ejemplos = cat.ejemplos.map((e) => `<li>${e}</li>`).join("");
      const nota = cat.nota ? `<p class="cat-nota">${cat.nota}</p>` : "";
      return `
        <div class="veredicto ${it.ok ? "ok" : "no"}">${it.veredicto}</div>
        <h3>${cat.titulo}</h3>
        <p class="cat-desc">${cat.desc}</p>
        <h4>Ejemplos</h4>
        <ul class="cat-ejemplos">${ejemplos}</ul>
        ${nota}
      `;
    }

    function htmlDisciplina() {
      const disc = DISCIPLINA_VS.disciplina.map((e) => `<li>${e}</li>`).join("");
      const viol = DISCIPLINA_VS.violencia.map((e) => `<li>${e}</li>`).join("");
      return `
        <h3>⚖️ Disciplina vs. violencia</h3>
        <p class="info-lead">Educar y poner límites no es lo mismo que lastimar. Estas son las diferencias.</p>
        <div class="veredicto ok">✅ Disciplina (educa y cuida)</div>
        <ul class="cat-ejemplos">${disc}</ul>
        <div class="veredicto no">🚫 Violencia (lastima y controla)</div>
        <ul class="cat-ejemplos">${viol}</ul>
        <p class="cat-nota">${DISCIPLINA_VS.clave}</p>
      `;
    }

    function renderInfo() {
      const cur = vistaStack[vistaStack.length - 1];
      infoBack.classList.toggle("hidden", vistaStack.length <= 1);
      if (cur.vista === "indice") infoBody.innerHTML = htmlIndice();
      else if (cur.vista === "detalle") infoBody.innerHTML = htmlDetalle(cur.arg);
      else if (cur.vista === "disciplina") infoBody.innerHTML = htmlDisciplina();
      else infoBody.innerHTML = htmlMenu();
      infoBody.scrollTop = 0;
    }
    function irA(vista, arg) { vistaStack.push({ vista, arg }); renderInfo(); }
    function abrirInfo() { vistaStack = [{ vista: "menu" }]; renderInfo(); infoOverlay.classList.remove("hidden"); }
    function cerrarInfo() { infoOverlay.classList.add("hidden"); }

    document.getElementById("ayuda").onclick = abrirInfo;
    infoClose.onclick = cerrarInfo;
    infoBack.onclick = () => { if (vistaStack.length > 1) { vistaStack.pop(); renderInfo(); } };
    infoOverlay.addEventListener("click", (e) => { if (e.target === infoOverlay) cerrarInfo(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarInfo(); });
    infoBody.addEventListener("click", async (e) => {
      const el = e.target.closest("[data-goto],[data-action]");
      if (!el) return;
      if (el.dataset.action === "logout") {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "/login.html";
        return;
      }
      if (el.dataset.goto === "indice") irA("indice");
      else if (el.dataset.goto === "disciplina") irA("disciplina");
      else if (el.dataset.goto === "detalle") irA("detalle", Number(el.dataset.idx));
    });

    init();
  </script>
</body>
</html>
